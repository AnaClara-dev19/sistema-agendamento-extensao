<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Inter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Keila Maria Unhas - Login</title>
</head>

<body class="login">

    <div class="pagina">

        <div class="titulo">
            <h1>Keila Maria Unhas</h1>
            <h1>oficial</h1>
        </div>

        <div class="card">
            <h1 class="bem-vindo">Bem-Vindo!</h1>

            <p class="chave">Entre com seu e-mail e senha</p>

            <form id="formLogin">
                <input type="email" id="email" name="email" placeholder="Seu e-mail" autocomplete="username" required>

                <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password"
                    required>

                <button type="submit" class="botao botao-pequeno">
                    Entrar
                </button>
            </form>

            <p id="mensagemLogin"></p>
        </div>


        <!--Links para js e supabase-->
        <script src="supabase.js"></script>
        <script src="app.js"></script>
</body>

</html>
